[project]
name = "insider-screen"
version = "0.1.0"
description = "Pre-announcement trading screen validated against SEC insider-trading charges"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "exchange-calendars>=4.13.2",
    "httpx>=0.27",
    "lxml>=5.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insider_screen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
